          type: number
        planCode:
          type: string
        planName:
          type: string
        planNameAr:
          type: string
        status:
          type: string
          enum: [active, pending_payment, expired, cancelled]
        startedAt:
          type: string
          format: date-time
        expiresAt:
          type: ["string", "null"]
          format: date-time
        paymentMethod:
          type: ["string", "null"]
        paymentNote:
