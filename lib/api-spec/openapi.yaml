          type: string
          enum: [free, general_english, professional_english]
        name:
          type: string
        nameAr:
          type: string
        description:
          type: ["string", "null"]
        descriptionAr:
          type: ["string", "null"]
        priceUsd:
          type: number
        currency:
          type: string
        billingCycle:
          type: string
          enum: [monthly, yearly]
        features:
          type: array
          items:
            type: string
        featuresAr:
          type: array
          items:
            type: string
        includesConversationPartner:
          type: boolean
        lessonsAccess:
          type: string
          enum: [a1_only, full, professional_only]

    SubscriptionInput:
      type: object
      required: [planCode, paymentMethod]
      properties:
