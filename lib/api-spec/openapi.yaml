openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Ascension / لغتي — Syrian-first English learning platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: profile
    description: Student profile
  - name: placement
    description: Placement test
  - name: levels
    description: Curriculum levels
  - name: lessons
    description: Lessons and lesson content
  - name: exercises
    description: Exercise submission
  - name: vocabulary
    description: Vocabulary items
  - name: subscriptions
    description: Subscription plans and management
  - name: dashboard
    description: Student dashboard
  - name: review
    description: Lesson review
  - name: admin
    description: Admin operations
  - name: languages
    description: Languages and curricula (target/learner language configuration)

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── Auth ───────────────────────────────────────────────────────────────────

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new student
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout current session
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Profile ────────────────────────────────────────────────────────────────

  /profile:
    get:
      operationId: getProfile
      tags: [profile]
      summary: Get student profile
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentProfile"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateProfile
      tags: [profile]
      summary: Update student profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentProfile"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Placement Test ─────────────────────────────────────────────────────────

  /placement-test:
    get:
      operationId: getPlacementTest
      tags: [placement]
      summary: Get placement test questions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlacementTest"

  /placement-test/submit:
    post:
      operationId: submitPlacementTest
      tags: [placement]
      summary: Submit placement test answers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlacementTestSubmission"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlacementTestResult"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Levels ─────────────────────────────────────────────────────────────────

  /levels:
    get:
      operationId: getLevels
      tags: [levels]
      summary: List all curriculum levels
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Level"

  /levels/{levelId}:
    get:
      operationId: getLevel
      tags: [levels]
      summary: Get a single level with its lesson summaries
      parameters:
        - name: levelId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LevelDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Lessons ────────────────────────────────────────────────────────────────

  /lessons:
    get:
      operationId: getLessons
      tags: [lessons]
      summary: List lessons, optionally filtered by level
      parameters:
        - name: levelId
          in: query
          schema:
            type: number
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LessonSummary"

  /lessons/{lessonId}:
    get:
      operationId: getLesson
      tags: [lessons]
      summary: Get full lesson content (requires subscription or free tier check)
      parameters:
        - name: lessonId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonDetail"
        "403":
          description: Locked (lesson not yet unlocked or requires subscription)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /lessons/{lessonId}/start:
    post:
      operationId: startLesson
      tags: [lessons]
      summary: Mark lesson as started, returns or creates progress record
      parameters:
        - name: lessonId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonProgress"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /lessons/{lessonId}/blocks/{blockId}/submit:
    post:
      operationId: submitLessonActivity
      tags: [lessons]
      summary: Submit or complete one configured lesson activity
      parameters:
        - name: lessonId
          in: path
          required: true
          schema:
            type: number
        - name: blockId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LessonActivitySubmission"
      responses:
        "200":
          description: Activity recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonActivityResult"
        "400":
          description: Invalid activity response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Lesson is locked or belongs to another curriculum
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Lesson or block not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /lessons/{lessonId}/complete:
    post:
      operationId: completeLesson
      tags: [lessons]
      summary: Complete a lesson using server-verified activity results
      parameters:
        - name: lessonId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LessonCompletionInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonProgress"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Required lesson activities are incomplete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonCompletionError"

  /lessons/{lessonId}/progress:
    get:
      operationId: getLessonProgress
      tags: [lessons]
      summary: Get student's progress for a specific lesson
      parameters:
        - name: lessonId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LessonProgress"
        "404":
          description: No progress record yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Exercises ──────────────────────────────────────────────────────────────

  /exercises/{exerciseId}/submit:
    post:
      operationId: submitExercise
      tags: [exercises]
      summary: Submit answer for an MCQ or predefined exercise
      parameters:
        - name: exerciseId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExerciseSubmission"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExerciseResult"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Exercise not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Vocabulary ─────────────────────────────────────────────────────────────

  /vocabulary:
    get:
      operationId: getVocabulary
      tags: [vocabulary]
      summary: Get vocabulary items, optionally filtered by lesson or level
      parameters:
        - name: lessonId
          in: query
          schema:
            type: number
        - name: levelId
          in: query
          schema:
            type: number
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VocabularyItem"

  # ─── Subscriptions ──────────────────────────────────────────────────────────

  /subscription-plans:
    get:
      operationId: getSubscriptionPlans
      tags: [subscriptions]
      summary: List all available subscription plans
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SubscriptionPlan"

  /subscription:
    get:
      operationId: getSubscription
      tags: [subscriptions]
      summary: Get current student subscription
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentSubscription"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createSubscription
      tags: [subscriptions]
      summary: Create or upgrade subscription (payment integration point)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentSubscription"
        "400":
          description: Payment not verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Dashboard ──────────────────────────────────────────────────────────────

  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get student dashboard summary stats
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Review ─────────────────────────────────────────────────────────────────

  /review/recent:
    get:
      operationId: getRecentLessons
      tags: [review]
      summary: Get recently completed lessons for review
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LessonSummary"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /review/weak-areas:
    get:
      operationId: getWeakAreas
      tags: [review]
      summary: Get lessons or topics where score was below 75%
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WeakAreaSummary"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Admin ──────────────────────────────────────────────────────────────────

  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Get platform-wide admin statistics
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"
        "403":
          description: Forbidden (not admin)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/students:
    get:
      operationId: getAdminStudents
      tags: [admin]
      summary: List all students (admin)
      parameters:
        - name: page
          in: query
          schema:
            type: number
        - name: limit
          in: query
          schema:
            type: number
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStudentList"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/lessons:
    get:
      operationId: getAdminLessons
      tags: [admin]
      summary: List all lessons (admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminLesson"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createAdminLesson
      tags: [admin]
      summary: Create a new lesson (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLessonInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLesson"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/lessons/{lessonId}:
    patch:
      operationId: updateAdminLesson
      tags: [admin]
      summary: Update a lesson (admin)
      parameters:
        - name: lessonId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLessonUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLesson"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Languages & Curricula ─────────────────────────────────────────────────

  /languages:
    get:
      operationId: getLanguages
      tags: [languages]
      summary: List all active languages
      description: >
        Returns all languages that can be used as a target (learning) or learner
        (native) language. Adding a new language requires only an INSERT into the
        languages table — no code changes.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Language"

  /curricula:
    get:
      operationId: getCurricula
      tags: [languages]
      summary: List all active curricula
      description: >
        Returns all active curricula. Each curriculum combines a target language
        and a learner language with its own independent level hierarchy.
        A new curriculum (using any level framework — CEFR, HSK, JLPT, or custom)
        can be created by inserting a row here and adding levels with the new
        curriculum_id. No code changes required.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Curriculum"

components:
  schemas:

    # ─── Languages & Curricula ─────────────────────────────────────────────────

    Language:
      type: object
      required: [id, code, name, nameNative, rtl]
      properties:
        id:
          type: number
        code:
          type: string
          description: ISO 639-1 language code (e.g. 'en', 'ar', 'de')
        name:
          type: string
          description: English display name
        nameNative:
          type: string
          description: Name in the language itself (e.g. 'العربية')
        rtl:
          type: boolean
          description: true for right-to-left languages

    Curriculum:
      type: object
      required: [id, targetLanguageCode, learnerLanguageCode, name, nameInLearnerLanguage, levelFramework]
      properties:
        id:
          type: number
        targetLanguageCode:
          type: string
          description: The language students are learning
        learnerLanguageCode:
          type: string
          description: The student's native/interface language
        name:
          type: string
        nameInLearnerLanguage:
          type: string
        levelFramework:
          type: string
          description: >
            Descriptive tag for the level system used (e.g. CEFR, CEFR_subdivided,
            HSK, JLPT, custom). Informational only — does not constrain level codes.
        description:
          type: ["string", "null"]
        descriptionInLearnerLanguage:
          type: ["string", "null"]

    # ─── Core ──────────────────────────────────────────────────────────────────

    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    SuccessResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean

    # ─── Auth ──────────────────────────────────────────────────────────────────

    RegisterInput:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 2
        email:
          type: string
        password:
          type: string
          minLength: 6
        preferredLanguage:
          type: string
          enum: [ar, en]
          default: ar
        country:
          type: string
          default: SY

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    User:
      type: object
      required: [id, name, email, role, createdAt]
      properties:
        id:
          type: number
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [student, admin, content_manager, content_reviewer]
        preferredLanguage:
          type: string
          enum: [ar, en]
        country:
          type: string
        createdAt:
          type: string
          format: date-time

    AuthResult:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"

    # ─── Profile ───────────────────────────────────────────────────────────────

    StudentProfile:
      type: object
      required: [id, userId, name, email, streakDays, totalLessonsCompleted, createdAt]
      properties:
        id:
          type: number
        userId:
          type: number
        name:
          type: string
        email:
          type: string
        # Derived from join with levels table — preserved for frontend display
        currentLevelCode:
          type: ["string", "null"]
        # FK to levels.id — the student's current level (curriculum-scoped)
        currentLevelId:
          type: ["number", "null"]
        # FK to curricula.id — which curriculum the student is enrolled in
        curriculumId:
          type: ["number", "null"]
        streakDays:
          type: number
        totalLessonsCompleted:
          type: number
        totalXp:
          type: number
        placementCompleted:
          type: boolean
        subscriptionPlan:
          type: ["string", "null"]
        bio:
          type: ["string", "null"]
        preferredLanguage:
          type: string
          enum: [ar, en]
        country:
          type: string
        createdAt:
          type: string
          format: date-time

    ProfileUpdate:
      type: object
      properties:
        name:
          type: string
        bio:
          type: string
        preferredLanguage:
          type: string
          enum: [ar, en]
        country:
          type: string

    # ─── Placement Test ────────────────────────────────────────────────────────

    PlacementQuestion:
      type: object
      required: [id, questionText, questionTextAr, type, options]
      properties:
        id:
          type: number
        questionText:
          type: string
        questionTextAr:
          type: string
        type:
          type: string
          enum: [mcq, fill_blank]
        options:
          type: array
          items:
            type: object
            required: [id, text]
            properties:
              id:
                type: string
              text:
                type: string
              textAr:
                type: ["string", "null"]
        order:
          type: number

    PlacementTest:
      type: object
      required: [questions]
      properties:
        questions:
          type: array
          items:
            $ref: "#/components/schemas/PlacementQuestion"

    PlacementTestAnswer:
      type: object
      required: [questionId, selectedOptionId]
      properties:
        questionId:
          type: number
        selectedOptionId:
          type: string

    PlacementTestSubmission:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          items:
            $ref: "#/components/schemas/PlacementTestAnswer"

    PlacementTestResult:
      type: object
      required: [score, total, percentage, assignedLevelCode, assignedLevelName, assignedLevelNameAr, message, messageAr]
      properties:
        score:
          type: number
        total:
          type: number
        percentage:
          type: number
        assignedLevelCode:
          type: string
        assignedLevelName:
          type: string
        assignedLevelNameAr:
          type: string
        message:
          type: string
        messageAr:
          type: string

    # ─── Levels ────────────────────────────────────────────────────────────────

    Level:
      type: object
      required: [id, curriculumId, code, name, nameAr, order, totalLessons, completedLessons, isUnlocked, isCompleted]
      properties:
        id:
          type: number
        curriculumId:
          type: number
        code:
          type: string
        name:
          type: string
        nameAr:
          type: string
        description:
          type: ["string", "null"]
        descriptionAr:
          type: ["string", "null"]
        order:
          type: number
        totalLessons:
          type: number
        completedLessons:
          type: number
        isUnlocked:
          type: boolean
        isCompleted:
          type: boolean

    LevelDetail:
      type: object
      required: [id, curriculumId, code, name, nameAr, order, totalLessons, completedLessons, isUnlocked, isCompleted, lessons]
      properties:
        id:
          type: number
        curriculumId:
          type: number
        code:
          type: string
        name:
          type: string
        nameAr:
          type: string
        description:
          type: ["string", "null"]
        descriptionAr:
          type: ["string", "null"]
        order:
          type: number
        totalLessons:
          type: number
        completedLessons:
          type: number
        isUnlocked:
          type: boolean
        isCompleted:
          type: boolean
        lessons:
          type: array
          items:
            $ref: "#/components/schemas/LessonSummary"

    # ─── Lessons ───────────────────────────────────────────────────────────────

    LessonSummary:
      type: object
      required: [id, levelId, levelCode, title, titleAr, order, lessonType, estimatedMinutes, state, isUnlocked, isCompleted, bestScore, xpReward]
      properties:
        id:
          type: number
        levelId:
          type: number
        levelCode:
          type: string
        title:
          type: string
        titleAr:
          type: string
        description:
          type: ["string", "null"]
        descriptionAr:
          type: ["string", "null"]
        order:
          type: number
        lessonType:
          type: string
          enum: [general, reading, pronunciation, speaking, vocabulary, grammar, conversation]
        estimatedMinutes:
          type: number
        state:
          type: string
          enum: [LOCKED, AVAILABLE, IN_PROGRESS, COMPLETED]
        isUnlocked:
          type: boolean
        isCompleted:
          type: boolean
        bestScore:
          type: ["number", "null"]
        xpReward:
          type: number

    ContentBlock:
      type: object
      required: [id, type, order, isRequired, isCompleted]
      properties:
        id:
          type: number
        type:
          type: string
          enum: [text, vocabulary_list, mcq, speaking_prompt, pronunciation_guide, audio_placeholder, open_ended, dialogue, explanation, spelling, review]
        order:
          type: number
        title:
          type: ["string", "null"]
        titleAr:
          type: ["string", "null"]
        instructions:
          type: ["string", "null"]
        instructionsAr:
          type: ["string", "null"]
        isRequired:
          type: boolean
        isCompleted:
          type: boolean
        estimatedMinutes:
          type: ["number", "null"]
        # text block
        content:
          type: ["string", "null"]
        contentAr:
          type: ["string", "null"]
        # audio placeholder
        audioNote:
          type: ["string", "null"]
        audioUrl:
          type: ["string", "null"]
        # vocabulary list embedded ref
        vocabularyItems:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/VocabularyItem"
        # mcq
        exerciseId:
          type: ["number", "null"]
        exerciseType:
          type: ["string", "null"]
        question:
          type: ["string", "null"]
        questionAr:
          type: ["string", "null"]
        options:
          type: ["array", "null"]
          items:
            type: object
            required: [id, text]
            properties:
              id:
                type: string
              text:
                type: string
              textAr:
                type: ["string", "null"]
        # speaking / pronunciation
        prompt:
          type: ["string", "null"]
        promptAr:
          type: ["string", "null"]
        exampleAudio:
          type: ["string", "null"]

    LessonDetail:
      type: object
      required: [id, levelId, levelCode, title, titleAr, order, lessonType, estimatedMinutes, state, isUnlocked, isCompleted, bestScore, xpReward, passingScore, contentBlocks, completedBlockIds]
      properties:
        id:
          type: number
        levelId:
          type: number
        levelCode:
          type: string
        title:
          type: string
        titleAr:
          type: string
        description:
          type: ["string", "null"]
        descriptionAr:
          type: ["string", "null"]
        order:
          type: number
        lessonType:
          type: string
          enum: [general, reading, pronunciation, speaking, vocabulary, grammar, conversation]
        estimatedMinutes:
          type: number
        state:
          type: string
          enum: [AVAILABLE, IN_PROGRESS, COMPLETED]
        isUnlocked:
          type: boolean
        isCompleted:
          type: boolean
        bestScore:
          type: ["number", "null"]
        xpReward:
          type: number
        passingScore:
          type: number
        contentBlocks:
          type: array
          items:
            $ref: "#/components/schemas/ContentBlock"
        completedBlockIds:
          type: array
          items:
            type: number
        objectives:
          type: ["array", "null"]
          items:
            type: string
        objectivesAr:
          type: ["array", "null"]
          items:
            type: string

    LessonCompletionInput:
      type: object
      properties:
        timeSpentSeconds:
          type: number

    LessonProgress:
      type: object
      required: [id, lessonId, userId, status, attempts, passed, xpEarned, nextLessonUnlocked]
      properties:
        id:
          type: number
        lessonId:
          type: number
        userId:
          type: number
        status:
          type: string
          enum: [not_started, in_progress, completed, passed, failed]
        bestScore:
          type: ["number", "null"]
        lastScore:
          type: ["number", "null"]
        attempts:
          type: number
        passed:
          type: boolean
        completedAt:
          type: ["string", "null"]
          format: date-time
        startedAt:
          type: ["string", "null"]
          format: date-time
        xpEarned:
          type: number
        nextLessonUnlocked:
          type: boolean
        nextLessonId:
          type: ["number", "null"]
        missingRequiredBlockIds:
          type: array
          items:
            type: number
        timeSpentSeconds:
          type: number

    LessonCompletionError:
      type: object
      required: [error, missingRequiredBlockIds]
      properties:
        error:
          type: string
        missingRequiredBlockIds:
          type: array
          items:
            type: number

    LessonActivitySubmission:
      type: object
      required: [clientSubmissionId]
      properties:
        clientSubmissionId:
          type: string
          minLength: 1
        selectedOptionId:
          type: string
        responseText:
          type: string
        mediaReference:
          type: string
        recordingDurationSeconds:
          type: number
        timeSpentSeconds:
          type: number

    LessonActivityResult:
      type: object
      required: [attemptId, blockId, completed, correct, score, explanation, explanationAr, evaluationStatus]
      properties:
        attemptId:
          type: number
        blockId:
          type: number
        completed:
          type: boolean
        correct:
          type: ["boolean", "null"]
        score:
          type: ["number", "null"]
        explanation:
          type: ["string", "null"]
        explanationAr:
          type: ["string", "null"]
        evaluationStatus:
          type: string
          enum: [not_required, pending, completed]

    # ─── Exercises ─────────────────────────────────────────────────────────────

    ExerciseSubmission:
      type: object
      required: [selectedOptionId]
      properties:
        selectedOptionId:
          type: string

    ExerciseResult:
      type: object
      required: [correct, explanation]
      properties:
        correct:
